name: Deploy to OCI Object Storage

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
          echo -e "\n" | bash install.sh --accept-all-defaults
          echo "$HOME/lib/oracle-cli/bin" >> $GITHUB_PATH

      - name: Setup OCI config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << OCIEOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          OCIEOF

      - name: Upload to OCI Object Storage
        run: |
          oci os object put \
            --bucket-name JohnG-personal \
            --file index.html \
            --name index.html \
            --force \
            --content-type text/html --cache-control "no-cache" --namespace ax9xub0hkknv
